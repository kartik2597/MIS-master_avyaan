<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" fill="none" role="img" aria-label="Illustration of a reporting dashboard with KPI tiles, a bar chart, a donut chart and an uploaded report">
  <defs>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#3B6FE0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3B6FE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BA6FF"/>
      <stop offset="1" stop-color="#3B6FE0" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="520" height="340" fill="url(#glow)"/>

  <!-- Dashboard window -->
  <rect x="20" y="24" width="400" height="280" rx="16" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".16"/>
  <circle cx="42" cy="44" r="4" fill="#FF6B6B"/>
  <circle cx="56" cy="44" r="4" fill="#F2A93B"/>
  <circle cx="70" cy="44" r="4" fill="#2FBF8A"/>
  <rect x="150" y="38" width="120" height="12" rx="6" fill="#fff" fill-opacity=".1"/>

  <!-- KPI tiles -->
  <g>
    <rect x="40" y="68" width="112" height="56" rx="10" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".1"/>
    <rect x="52" y="80" width="40" height="6" rx="3" fill="#fff" fill-opacity=".35"/>
    <rect x="52" y="96" width="64" height="14" rx="4" fill="#fff" fill-opacity=".85"/>
    <rect x="164" y="68" width="112" height="56" rx="10" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".1"/>
    <rect x="176" y="80" width="46" height="6" rx="3" fill="#fff" fill-opacity=".35"/>
    <rect x="176" y="96" width="56" height="14" rx="4" fill="#7EF0C0"/>
    <rect x="288" y="68" width="112" height="56" rx="10" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".1"/>
    <rect x="300" y="80" width="36" height="6" rx="3" fill="#fff" fill-opacity=".35"/>
    <rect x="300" y="96" width="70" height="14" rx="4" fill="#fff" fill-opacity=".85"/>
  </g>

  <!-- Bar chart -->
  <rect x="40" y="140" width="224" height="148" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/>
  <g fill="url(#bar)">
    <rect x="54" y="236" width="14" height="36" rx="3"/>
    <rect x="79" y="220" width="14" height="52" rx="3"/>
    <rect x="104" y="228" width="14" height="44" rx="3"/>
    <rect x="129" y="204" width="14" height="68" rx="3"/>
    <rect x="154" y="212" width="14" height="60" rx="3"/>
    <rect x="179" y="188" width="14" height="84" rx="3"/>
    <rect x="204" y="198" width="14" height="74" rx="3"/>
    <rect x="229" y="174" width="14" height="98" rx="3"/>
  </g>
  <path d="M61 224 L86 208 L111 216 L136 192 L161 200 L186 176 L211 186 L236 162" stroke="#7EF0C0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="236" cy="162" r="4" fill="#7EF0C0"/>
  <line x1="50" y1="272" x2="254" y2="272" stroke="#fff" stroke-opacity=".15"/>

  <!-- Donut chart -->
  <rect x="276" y="140" width="124" height="148" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/>
  <g transform="rotate(-90 338 196)" stroke-width="11" fill="none">
    <circle cx="338" cy="196" r="34" stroke="#fff" stroke-opacity=".1"/>
    <circle cx="338" cy="196" r="34" stroke="#6C9BFF" stroke-dasharray="128 213.6" stroke-linecap="round"/>
    <circle cx="338" cy="196" r="34" stroke="#2FBF8A" stroke-dasharray="52 213.6" stroke-dashoffset="-134" stroke-linecap="round"/>
    <circle cx="338" cy="196" r="34" stroke="#F2A93B" stroke-dasharray="20 213.6" stroke-dashoffset="-192" stroke-linecap="round"/>
  </g>
  <text x="338" y="202" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">92%</text>
  <g>
    <circle cx="298" cy="252" r="3.5" fill="#6C9BFF"/><rect x="308" y="249" width="60" height="6" rx="3" fill="#fff" fill-opacity=".3"/>
    <circle cx="298" cy="265" r="3.5" fill="#2FBF8A"/><rect x="308" y="262" width="44" height="6" rx="3" fill="#fff" fill-opacity=".3"/>
    <circle cx="298" cy="278" r="3.5" fill="#F2A93B"/><rect x="308" y="275" width="52" height="6" rx="3" fill="#fff" fill-opacity=".3"/>
  </g>

  <!-- Floating "Validated" badge -->
  <g>
    <rect x="388" y="8" width="120" height="36" rx="18" fill="#0F1A33" stroke="#fff" stroke-opacity=".18"/>
    <circle cx="408" cy="26" r="7" fill="#2FBF8A"/>
    <path d="M404.6 26.2 L407.2 28.8 L411.6 23.8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="422" y="30" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#fff">Validated</text>
  </g>

  <!-- Floating uploaded report card -->
  <g>
    <rect x="330" y="258" width="180" height="64" rx="12" fill="#0F1A33" stroke="#fff" stroke-opacity=".18"/>
    <rect x="344" y="272" width="28" height="36" rx="6" fill="#2FBF8A" fill-opacity=".2" stroke="#2FBF8A" stroke-opacity=".6"/>
    <text x="358" y="294" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#7EF0C0">XLS</text>
    <rect x="382" y="276" width="72" height="7" rx="3.5" fill="#fff" fill-opacity=".85"/>
    <rect x="382" y="290" width="52" height="6" rx="3" fill="#fff" fill-opacity=".35"/>
    <rect x="382" y="302" width="86" height="4" rx="2" fill="#fff" fill-opacity=".12"/>
    <rect x="382" y="302" width="64" height="4" rx="2" fill="#6C9BFF"/>
    <circle cx="488" cy="290" r="9" fill="#2FBF8A"/>
    <path d="M483.8 290.2 L486.8 293.2 L492 287.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
